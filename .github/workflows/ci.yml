name: CI

# Lint, compilation et tests unitaires à chaque PR et sur les branches
# principales : une régression ne doit pas pouvoir être fusionnée sans
# qu'aucun test n'ait tourné. Les tests e2e (base de données réelle) ne
# sont pas lancés ici.

on:
  pull_request:
  push:
    branches: [main, develop]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: node scripts/verifier-version.mjs
      - run: npm ci
      # Toutes les dependances (dev comprises) : une vulnerabilite high ou
      # critical ne doit pas pouvoir entrer sans faire echouer le CI.
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run build
      - run: npm run test:cov
